- id: cleanup-glob-matches-more-than-ms
  category: behaviour
  stage: cleanup.sh / allSPW_cleanup.sh
  symptom: "Which files would the generated cleanup scripts delete, and would running M2's cleanup.sh be safe?"
  evidence:
