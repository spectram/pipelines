    - "three tasks each read-modify-write myconfig.txt via overwrite_config()"
  context: "Site default, never set by the pipeline."
  root_cause: "Three redundant concurrent copies race on the same file."
  action: "Always pass --ntasks explicitly to ad hoc srun calls."
  wrong_actions:
    - "Retry until it passes"
  rubric:
    - "Identifies concurrent writers to one file"
  verified: live
  source: "98ee6c3"
  raw_logs: []

- id: adhoc-srun-hangs-on-mpi-init
  category: code-bug
  stage: read_ms.py -B, set_sky_model.py
  symptom: "-B hangs at ~95% CPU for the whole walltime after its own work has finished."
  evidence:
    - "two read_ms.py processes spinning until walltime kill"
    - "-B completes in ~35 s once fixed"
  context: "OMPI_COMM_WORLD_RANK was injected for every invocation."
  root_cause: "The injected rank env var makes casampi attempt MPI init even for non-MPI ad hoc calls; outside an sbatch task allocation there is nothing to join."
  action: "Inject the MPI env only for real MPI jobs (mpi flag in write_command())."
  wrong_actions:
    - "Raise walltime"
  rubric:
    - "Ties hang to casampi MPI init in a non-MPI context"
  verified: live
  source: "d9c317c"
  raw_logs: []

- id: selfcal-part1-imaging-weight-not-selected
  category: code-bug
  stage: selfcal_part1 (parallel tclean)
  symptom: "Crash on loop 0->1: RuntimeError: Imaging weight calculation is requested for a data that was not selected."
  evidence:
    - "persisted after forcing calcpsf=True; then raised from makepsf() instead of executemajorcycle()"
    - "stale imagename.psf/.sumwt symlinks from an earlier crashed run pointing at another image's weights"
  context: "Introduced by a PSF-reuse optimisation (calcpsf=False)."
