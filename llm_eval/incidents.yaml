# SCOPE: cluster- and container-specific data, for the LLM-operator prototype only. Job IDs, node names,
# scratch paths, container paths and versions (Setonix, idianext.sif, CASA/casampi as deployed) are kept
# deliberately: they are what makes these cases realistic replay inputs. Not intended as general
# documentation, and not portable to other clusters or container builds without re-capturing evidence.
#
# Incident cases for evaluating an LLM-assisted operator of this pipeline (DRAFT v0, for review).
#
# Each case is one real event from this project, written so it can be posed as:
#   INPUT  = symptom + evidence (+ context)     -> what the operator sees
#   OUTPUT = diagnosis + action                 -> what a good operator concludes and does
# and graded against `rubric` (the points a correct answer must hit) and `wrong_actions`
# (tempting responses that would waste time or damage data).
#
# Fields
#   id            stable slug
#   category      transient | resource | config | code-bug | container | data-quality | benign | misread | behaviour
#   stage         pipeline step involved
#   symptom       what is observed first (the prompt)
#   evidence      concrete observables (log lines, counts, sacct facts) -- the retrievable clues
#   context       run/config facts needed to reach the answer
#   root_cause    accepted diagnosis
#   action        correct response
#   wrong_actions plausible but incorrect responses
#   rubric        checklist a grader can tick
#   hypothesis_trail  (optional) the wrong or unconfirmed turns on the way to the answer -- graders should
#                 reward NOT repeating them; a good operator tests them cheaply before committing.
#   human_correction  (optional) where the user redirected the operator, and how.
#   verified      live      = fix confirmed on a real run
#                 inferred  = reasoned from logs/source, not confirmed by experiment
#                 open      = cause or fix not established
#   source        where the write-up lives (commit or profiling_notes.md section)
#   raw_logs      paths of real logs that could be replayed as input (M2 = /scratch/pawsey1164/ssankar/N4064/M2)
#                 -- absent where only the write-up survives; those cases need a log excerpt captured
#                 before they can be used as real (not paraphrased) input.
#
# Draft status: written from profiling_notes.md, commit messages and this session's transcript.
# Nothing here has been re-checked against the raw logs; entries marked TODO-REVIEW need your call.

cases:

# ------------------------------------------------------------------ MPI / scheduling / state

- id: pmi-bootstrap-failure-at-startup
  category: transient
  stage: hi_image (any srun MPI step)
  symptom: "hi_image job FAILED (exit 143) 5 minutes after start; dependent jobs CANCELLED; no hi_combo output written."
  evidence:
    - "stderr: '_pmi_mmap_tmp: Warning bootstrap barrier failed: num_syncd=7, pes_this_node=8, timeout=180 secs'"
    - "stderr: 'MPIR_pmi_init(110): PMI_Init returned 1' then 'Fatal error in PMPI_Init_thread'"
    - "srun: 'Terminating StepId=... DUE TO TASK FAILURE'; every task Terminated"
    - "no output from hi_image.py itself in the .out/.err"
  context: "Same sbatch and config had run fine before. .config.tmp unchanged (combo/stage/continue=True)."
  root_cause: "One rank failed to complete Cray PMI bootstrap within 180 s, so MPI never initialised. Happens before any pipeline code runs. Occurred on two different nodes (nid001034, then nid002499), so not attributable to one bad node."
  action: "Confirm .config.tmp is unchanged, resubmit the same job(s). Optionally --exclude the failing node, but do not expect that to prevent recurrence."
  wrong_actions:
    - "Edit config or code (nothing pipeline-side failed)"
    - "Reset the whole chain / rerun submit_pipeline.sh"
    - "Conclude the node named in the log is the only bad one"
  rubric:
    - "Identifies failure as MPI/PMI init, before hi_image.py ran"
    - "Says no pipeline state was changed, so resubmit is safe"
    - "Resubmits only the failed step and its dependants, not the full chain"
  verified: live   # both failures were cured by resubmitting unchanged (stage 0 ran 19h37m; stage 1 then ran to its walltime). --exclude of the first node did not prevent the second failure on another node.
  source: "session 2026-09-25/27; jobs 49991294, 49997165"
  raw_logs: ["M2/logs/hi_image-49991294.err", "M2/logs/hi_image-49997165.err"]

- id: hi-image-hangs-when-tclean-skipped
  category: code-bug
  stage: hi_image (finishing pass, image already exists)
  symptom: "Finishing hi_image job did its work in ~7 min (rebin, export, beam collapse, velocity conversion) then sat with no output until cancelled at ~6.5 h."
  evidence:
    - "log simply ends after the last script line; no error"
    - "stage image already present so image_engine.run_stage() returned before calling tclean"
  context: "hi_image.py is a 16-task MPI job and imports casampi at the top; ranks 1-15 sit in a worker loop."
  root_cause: "casampi's atexit stop_services hook is registered only when MPIInterface() is created inside tclean (task_tclean.py:361). Skipping tclean means the hook never exists, rank 0 exits and the workers wait forever. Any hi_image re-run for a stage whose image exists will hang."
  action: "Cancel the job (work already done). Proper fix not yet written: instantiate MPIInterface() at startup or on the skip path."
  wrong_actions:
    - "Wait longer"
    - "Re-run with more memory/walltime"
    - "Assume the export failed and redo it"
  rubric:
    - "Notes the productive work finished early and the tail is a hang, not slowness"
    - "Ties hang to skipped tclean / missing atexit MPI shutdown"
    - "Cancels rather than waits"
  verified: inferred  # from logs + casampi source; stuck processes were not inspected; fix untested
  source: "profiling_notes.md 'Why the finishing hi_image hung'; job 49970254"
  raw_logs: []

- id: restore-only-tclean-crash-at-teardown
  category: code-bug
  stage: hi_image (stage 1, niter=0, calcres=False)
  symptom: "hi_image (restore-only, submitted to write stage1.image) FAILED after ~1 h with RuntimeError: Parallel transport layer not initialized."
  evidence:
    - "traceback from releasempi at teardown"
    - "stage1.image did not exist beforehand: this restore-only run was submitted to produce it, and tclean finished the restore (wrote stage1.image at 19:30) before the crash"
    - "the decision not to clean further was the user's, from inspecting the residual and model (judged converged) before submitting"
    - "afterwards, per-channel rms sampled on the restored image: 2.6-3.0e-4 Jy/beam at channels 100/380/600, matching the ~0.28 mJy/beam the user had measured -- a consistency check, not the basis for the decision"
  context: "Deliberately ran niter=0 with reused residual/model to trigger restore only."
  root_cause: "With no gridding the parallel imager was never set up, but tclean still tried to release it. task_tclean still runs restoreImages() for niter=0 + calcres=False, so the image was written before the crash."
  action: "Treat as success for the image; check the .image exists and is sane, then proceed to post-processing. Do not rerun tclean."
  wrong_actions:
    - "Rerun the stage from scratch"
    - "Treat FAILED state as meaning no image"
  rubric:
    - "Recognises the crash is at teardown, after the image was written"
    - "Verifies the image on disk rather than trusting job state"
  verified: live
  source: "profiling_notes.md 'Restore-only run'; job 49952912"
  raw_logs: []

- id: config-tmp-state-after-final-sofia
  category: config
  stage: hi_sofia -> any standalone rerun
  symptom: "Standalone rerun of hi_sofia/hi_image looks for a directory or stage that does not exist (e.g. hi_combo1), or the resubmitted job exits immediately doing nothing."
  evidence:
    - ".config.tmp shows combo=1, stage=0 for a one-combo config, after the final hi_sofia"
    - "after a crashed job, [run] continue = False"
  context: "Runtime state lives in .config.tmp, which pipeline scripts advance; -R/submit_pipeline.sh reset it from myconfig.txt."
  root_cause: "The final hi_sofia advances combo/stage past the end; a crash leaves continue=False, which makes every later script skip itself."
  action: "Diff myconfig.txt against .config.tmp first. Restore combo/stage to the values wanted and set continue=True before resubmitting; do not rerun submit_pipeline.sh."
  wrong_actions:
    - "Rerun full submit_pipeline.sh (resets and restarts the whole chain)"
    - "Regenerate scripts with -R without restoring progressed fields"
  rubric:
    - "Checks .config.tmp vs myconfig.txt before acting"
    - "Restores combo, stage and continue explicitly"
  verified: live
  source: "profiling_notes.md 'Resume gotchas'; CLAUDE.md 'Resuming a partially-run pipeline'"
  raw_logs: []

# ------------------------------------------------------------------ tclean convergence / masking

- id: blind-stage0-noise-chasing
  category: config
  stage: hi_image stage 0 (mask=None)
  symptom: "Stage 0 hits the 24 h walltime (TIMEOUT) though it was still iterating (advancing counters on two checks 20 s apart)."
  evidence:
    - "600+ 'Possible divergence. Peak residual increased by 10% from minimum.' warnings; every channel batch logs it"
    - "peak residuals 2.6-3 mJy against threshold 0.6 mJy at robust 0.0; residual rms already at/below threshold"
    - "robust 1.0 combo at the same niter finished in 5h36m"
  context: "1263 or 765 channels, almost all pure noise; unmasked blind clean; threshold near the noise floor."
  root_cause: "Threshold sits at or below the noise floor and nothing restricts cleaning to real emission, so each channel chases noise. Robust 0.0 has a higher noise floor than robust 1.0, so the shared threshold suits one combo and not the other."
  action: "Investigate the divergence first (measure the residual rms, the threshold and the mask), then lay out the options for the user to choose: lower niter, raise the threshold, or usemask='auto-multithresh'. On this data the user first chose a blind clean at niter=5000 (finished in 5h36m for robust 1.0), then auto-multithresh for robust 0.0. A higher threshold alone finished but gave an unusable mask (next case)."
  wrong_actions:
    - "Just extend walltime"
    - "Add nodes/ranks (not the lever)"
    - "Raise threshold and assume the result is fine"
  rubric:
    - "Reads divergence warnings + threshold-vs-rms as noise chasing, not a stall"
    - "Distinguishes still-iterating from hung"
    - "Measures before proposing (residual rms vs threshold, mask coverage)"
    - "Offers niter / threshold / auto-multithresh as options and leaves the choice to the user"
  hypothesis_trail:
    - "Operator misread 'chans=10' in the tclean log as the cube's channel count. It is tclean's per-batch chunk size; the real cube has 1263 channels. Found by measuring the image shape."
    - "Operator advised raising the threshold to ~3-4 mJy (robust 0.0). The threshold later used (1.0 mJy) ran to completion but produced a mask SoFiA could not use."
  human_correction: "User asked to 'investigate the divergence first before deciding on new parameters', then chose the blind niter=5000 run themselves, and later chose auto-multithresh."
  verified: live   # auto-multithresh: zero divergence warnings, 21h22m, 2 reliable sources
  source: "profiling_notes.md 'Blind stage0 noise-chases'; jobs 49497554, 49846741; transcript 2026-09-13, 2026-09-21"
  raw_logs: []

- id: masking-pass-no-reliable-sources
  category: data-quality
  stage: hi_sofia masking pass
  symptom: "hi_sofia FAILED after ~5 min with 'No reliable sources found' even though real sources are visible by eye in the cube."
  evidence:
    - "2819 positive vs 2924 negative S+C candidates over the whole field"
    - "positive count is not meaningfully above negative, so reliability is ~0 for all"
  context: "Stage 0 was unmasked at threshold 1.0 mJy (raised to avoid timeout); noise-dominated cube."
  root_cause: "SoFiA's reliability step compares positive vs negative candidate counts; a noise-dominated cleaned cube gives near-equal counts so nothing is reliable."
  action: "Report the numbers (positive vs negative candidate counts, measured noise) and ask the user to inspect the stage 0 image and decide: a different threshold/niter combination, auto-multithresh, or deliberately keeping the blind clean (a blind tclean can be exactly what the user wants). Loosening reliability.threshold is a last resort, and the resulting sources need checking."
  wrong_actions:
    - "Treat as a SoFiA crash and rerun unchanged"
    - "Silently drop reliability to 0"
    - "Change stage 0's masking/threshold on its own initiative"
  rubric:
    - "Explains reliability as positive-vs-negative source counts"
    - "Points at the stage 0 image (noise-dominated) as where the problem originates"
    - "Asks the user to inspect the stage 0 image and choose threshold/niter or auto-multithresh, rather than deciding for them"
  hypothesis_trail:
    - "H1 (operator, unconfirmed): 345 of 1263 channels are exact zeros (the known empty-channel gap) and break the reliability model. Never confirmed."
    - "H2 (operator, WRONG): 'Global RMS 9.994e-01' vs the real 0.28 mJy/beam signals an RMS mismatch. Invalid comparison, see sofia-global-rms-looks-wrong."
    - "Accepted: negatives ~equal positives, so nothing is reliable."
  human_correction: "User inspected the cube directly ('the sources are there; RMS ~0.28 mJy/beam; beam 11x6 arcsec'), which ruled out a data problem and redirected the diagnosis to the reliability step."
  verified: live
  source: "profiling_notes.md N4064 single-combo; job 49773480; transcript 2026-09-22"
  raw_logs: []

- id: stage1-zero-iterations-timeout
  category: config
  stage: hi_image stage 1 (mask='prev', niter=1.5M, nmajor=-1)
  symptom: "Stage 1 TIMEOUT at 24 h with only 7 major cycles and no useful progress."
  evidence:
    - "all 9,102 SDAlgorithmBase::deconvolve lines read 'iters=0->0 [0], model=0->0, peakres=0->0, Reached cyclethreshold'"
    - "previous stage's mask contained only 3 detections in the whole cube"
    - "an early misread counted per-channel-batch 'Run multiscale minor-cycle' lines as major cycles (209 vs the real 7)"
  context: "nmajor=-1 (no cap)."
  root_cause: "With almost no masked area the residual inside is already below threshold, so every minor cycle does nothing. tclean has no 'nothing left to clean' stopping criterion, so it re-grids the full dataset every major cycle until walltime."
  action: "Cap major cycles (nmajor=15, now default) and fix the sparse mask upstream."
  wrong_actions:
    - "Increase walltime or memory"
    - "Count minor-cycle lines as major cycles"
  rubric:
    - "Reads iters=0->0 everywhere as 'no work', not 'slow'"
    - "Counts major cycles correctly"
    - "Recommends nmajor cap"
  hypothesis_trail:
    - "H1 (operator, WRONG): each major cycle is 'structurally too expensive'; stage 0 'did 209 major cycles' vs stage 1's 7. The 209 counted per-channel-batch minor-cycle lines; stage 0 really had 2 major cycles of ~2.5 h, comparable to stage 1's ~1h50m."
    - "H2 (user): stage 0 and 1 share one directory -- could file placement explain it? Operator checked: lfs getstripe shows identical progressive striping for both; ruled out."
    - "H3 (user): 'how come this re-gridding did not affect stage 0?' exposed the miscount and led to grepping every deconvolve line -- all iters=0->0."
  human_correction: "Two questions from the user (directory layout, why stage 0 was unaffected) broke a wrong 'too slow per cycle' story; 'bingo, exactly what I thought' on the zero-iterations finding."
  verified: live   # nmajor cap added afterwards as default; not yet shown to end a stage gracefully on a real run -- TODO-REVIEW after hi_combo_r1 stage 1
  source: "profiling_notes.md 'hi_image stage1 ... zero minor-cycle iterations'; job 48714725"
  raw_logs: []

- id: stage1-converged-but-hits-walltime
  category: config
  stage: hi_image stage 1 with derived threshold
  symptom: "Stage 1 (derived threshold 0.3611 mJy) still running at 21.7 h and will hit the 24 h wall."
  evidence:
    - "~71% of recently sampled channel batches report iters=0->0, Reached cyclethreshold; rest still cleaning"
    - "residual/model on disk look converged; per-channel sigma 2.6-3.0e-4 Jy/beam"
  context: "nmajor=-1. User does not want to clean into the noise."
  root_cause: "Most channels converged; remaining cycles buy little. No cap, so the job cannot finish gracefully."
  action: "Stop cleaning, restore from the existing residual/model (niter=0, calcres=False) to write the image, then post-process. Set nmajor for future runs."
  wrong_actions:
    - "Let it run to TIMEOUT and lose the export"
    - "Restart stage 1 from scratch"
  rubric:
    - "Judges convergence from deconvolve lines and residual stats"
    - "Uses restore-only path and keeps the existing model"
  verified: live
  source: "profiling_notes.md 'Stage 1 derived threshold and convergence'; jobs 49846743, 49952912"
  raw_logs: []

- id: sofia-kernel-channel-unit-mismatch
  category: config
  stage: hi_sofia (masking / final)
  symptom: "SoFiA finds only 3 sources in a deep 4-track cube (a single track had found 5)."
  evidence:
    - "kernelsZ=[0,3,5,7], radiusZ=minSizeZ=1 (defaults tuned for ~5.6 km/s/channel)"
    - "this mode gives ~1.4 km/s/channel: native 3.265 kHz (~0.689 km/s) x chanbin=2"
    - "rescaled 4x (kernelsZ [0,11,19,27], radiusZ/minSizeZ 4) found 18 including the known target at its catalogued position"
  context: "Correlator mode 32K_NE107M, chanbin=2."
  root_cause: "SoFiA spectral kernel/linker parameters are in channel units; the shipped defaults are exactly 4x too narrow for this channel width."
  action: "Scale kernelsZ (round to odd) and radiusZ/minSizeZ by the channel-width ratio; now applied per correlator mode at -B time. A config built by --combine from a stale template needs it by hand."
  wrong_actions:
    - "Lower reliability/SNR thresholds"
    - "Conclude the cube has few sources"
  rubric:
    - "Recognises channel-unit parameters vs real channel width"
    - "Computes the 4x ratio from chanwidth x chanbin"
  verified: live
  source: "profiling_notes.md 'Root cause of the sparse (3-detection) mask'; job 48771810"
  raw_logs: []

- id: sofia-global-rms-looks-wrong
  category: misread
  stage: hi_sofia (log inspection)
  symptom: "Masking log prints 'Global RMS: 9.994e-01', about 3600x the real ~0.28 mJy/beam. Suspected bug."
  evidence:
    - "measured per-plane sigma from the FITS: 2.6-3.3e-4 Jy/beam (median 2.78e-4)"
    - "'Assuming beam area of 1 px => reliability.minSNR may be wrong' also printed"
  context: "Non-final stage; noise scaling enabled."
  root_cause: "scaleNoise divides each channel by its own noise before that line prints, so it is ~1 by construction -- not a bug. The beam warning is separate: non-final stage FITS lacks scalar BMAJ/BMIN (per-plane beams live in a BEAMS table SoFiA does not read); it affects reliability.minSNR only."
  action: "No action on the RMS. Check real noise directly from the data. Beam warning is expected until the final stage stamps a median beam."
  wrong_actions:
    - "Report a SoFiA noise-estimation bug"
    - "Change parameters to 'fix' the RMS"
  rubric:
    - "Explains why the number is ~1"
    - "Separates the RMS print from the beam-area warning"
  verified: live   # first diagnosis was wrong and had to be corrected in-session
  source: "profiling_notes.md 'A misleading SoFiA number'"
  raw_logs: []

- id: sofia-oom-undersized-memory
  category: resource
  stage: hi_sofia
  symptom: "Standalone SoFiA test on the 4-track cube OOM'd at 32 GB."
  evidence:
    - "production run needed ~129 GB for the same cube size even with narrower kernels"
    - "rerun at 140 GB completed in 8m39s"
  context: "One full-cube-sized smoothed copy is made per kernel combination."
  root_cause: "Memory tracks cube size and number of kernel combinations, not kernel width. 32 GB was far below need."
  action: "Request memory from cube size (~130-140 GB for this cube), not from a smaller test's footprint."
  wrong_actions:
    - "Reduce kernels to save memory"
  rubric:
    - "Sizes memory from cube volume"
  verified: live
  source: "profiling_notes.md 'Standalone test'"
  raw_logs: []

# ------------------------------------------------------------------ resources / performance

- id: selfcal-part1-oom
  category: resource
  stage: selfcal_part1 (tclean, MPI, --exclusive)
  symptom: "selfcal_part1 OOM at loop 0 (niter=10000), both at 1 node/16 tasks (230 GB) and 2 nodes/16 tasks-per-node."
  evidence:
    - "dies right after SynthesisDeconvolver::setupDeconvolution during PSF/weight-density gather"
    - "~260 GB/node at last sample against a 230 GB budget"
    - "2-node run OOM'd on one specific node"
  context: "wprojplanes=512, scales=[0,5,10,15]."
  root_cause: "casampi splits only visibilities across ranks; image-side buffers (PSF, weight density, multiscale, w-kernels) are replicated on every rank. SLURM --mem is per node, so ranks-per-node is the lever, not node count."
  action: "Lower ranks per node (8) and reduce wprojplanes 512->128 and scales to [0,5,10]; measured ~200-207 GiB/node, 10-13% headroom, flat across niter."
  wrong_actions:
    - "Add more nodes at the same ranks-per-node"
    - "Assume memory grows with niter"
  rubric:
    - "States image buffers are replicated per rank"
    - "Names ranks-per-node as the control"
  verified: live
  source: "profiling_notes.md 'selfcal_part1 OOM investigation'"
  raw_logs: []

- id: hi-image-cycle-rate-depends-on-channel-count
  category: resource
  stage: hi_image (cube)
  symptom: "One run finished ~23 major cycles in 24 h; an earlier run over the same frequency window completed only 5 and hit the walltime."
  evidence:
    - "63 min/cycle at chanbin=2 (919 channels, 'Subcubes: 2', 353 GB required vs 184 GB available)"
    - "~4.8 h/cycle at chanbin=1 (~2,100 channels); a full-band chanbin=1 log showed 'Subcubes: 13'"
  context: "Same imspw, wprojplanes=128."
  root_cause: "CASA's memory estimator scales ~linearly with channel count; when it exceeds the budget each major cycle splits into sequential subcube passes, so cost compounds (2.3x channels -> ~4.6x cycle time)."
  action: "Expect chanbin/imspw to dominate cost. Narrow imspw or increase chanbin before adding ranks."
  wrong_actions:
    - "Add MPI ranks (serial vs parallel gap fell to ~2% at large chunks)"
  rubric:
    - "Reads 'Required memory ... Subcubes: N' as the driver"
  verified: inferred  # exact subcube count for the chanbin=1 narrowed run was interpolated, not measured
  source: "profiling_notes.md 'hi_image (cube mode): the same chanbin factor...'; jobs 47820395, 48228936"
  raw_logs: []

- id: memory-estimator-warning-not-fatal
  category: benign
  stage: hi_image (start of run)
  symptom: "CASA logs 'Required memory 401983440 kB (~402GB) vs Available mem 241172480 kB (~241GB)'. Should the job be cancelled?"
  evidence:
    - "1 node / 230 GB; full-scope imspw ~21 MHz, wprojplanes=256"
  context: "CASA can auto-chunk into subcubes."
  root_cause: "Not an error: CASA fits the budget by splitting into subcubes. It is a signal the job is expensive (see cycle-rate case), not that it will fail."
  action: "Do not cancel for this line alone; consider narrowing imspw/wprojplanes for time, not to avoid a crash."
  wrong_actions:
    - "Cancel and request 402 GB"
  rubric:
    - "Treats it as a cost signal, not a failure"
  verified: live
  source: "profiling_notes.md 'HI cube imaging ... 402GB memory warning'"
  raw_logs: []

# ------------------------------------------------------------------ silent failures / code bugs

- id: partition-empty-mms-numpy-scalar
  category: code-bug
  stage: partition.py -> validate_input.py
  symptom: "validate_input.py fails opening a table that does not exist; partition.py showed COMPLETED (exit 0)."
  evidence:
    - "remote ranks: NameError: name 'np' is not defined"
    - "call text serialised as 'nthreads=np.int64(2)'"
  context: "msmd.ncorrforpol() returns a numpy scalar, passed straight to mstransform(nthreads=)."
  root_cause: "casampi ships the call as text using NumPy 2 scalar repr, which is eval'd on remote ranks with no numpy import; mstransform never raised, so an empty MMS was produced silently."
  action: "Cast to plain int. When a step fails on 'missing data', check the previous step's output actually exists and is non-empty, even if it reported success."
  wrong_actions:
    - "Debug validate_input.py"
  rubric:
    - "Looks one step upstream of the failure"
    - "Names numpy-scalar repr over MPI"
  verified: live
  source: "af68f63"
  raw_logs: []

- id: srun-default-three-tasks-races-config
  category: code-bug
  stage: read_ms.py -B (ad hoc srun)
  symptom: "-B intermittently crashes with KeyError: 'crosscal' or writes a corrupted myconfig.txt."
