  context: "P1 total 2.9 TiB: cleanup.sh frees 680 G (per-SPW MMSs), allSPW_cleanup.sh 645 G; both ~1.3 TiB. Only sizes were measured; nothing was deleted."
  root_cause: "A shell glob 'ms' matches any name ending in 'ms', not just measurement sets."
